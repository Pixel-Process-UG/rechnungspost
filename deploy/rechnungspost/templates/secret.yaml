apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rechnungspost.fullname" . }}-secrets
  namespace: rechnungspost
  labels:
    {{- include "rechnungspost.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
