version: '3.9'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_KEY: base64:CHANGE_ME_RUN_php_artisan_key_generate==
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: rechnungspost
      DB_USERNAME: rechnungspost
      DB_PASSWORD: secret
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_BUCKET: rechnungspost
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - ./api:/var/www/html
      - api_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - rechnungspost

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rechnungspost
      POSTGRES_USER: rechnungspost
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rechnungspost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rechnungspost

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - rechnungspost

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - rechnungspost

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - rechnungspost

volumes:
  postgres_data:
  minio_data:
  api_vendor:

networks:
  rechnungspost:
    driver: bridge
